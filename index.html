<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Are you happy tushta</title>
<style>
:root{color-scheme:dark;--bg:#000}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BLUE_SHADES=["#3b82f6","#60a5fa","#93c5fd","#2563eb","#bfdbfe","#1d4ed8"];
const COUNT=2200;
let W,H,S,dpr;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W*0.9,H*0.75)/34;
}
addEventListener('resize',resize);resize();

function heartPoint(){
  const t=Math.random()*Math.PI*2;
  const k=Math.random()<0.4?0.96+Math.random()*0.06:Math.sqrt(Math.random());
  const x=16*Math.pow(Math.sin(t),3);
  const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return [x*k,(y+2.5)*k];
}
const P=[];
for(let i=0;i<COUNT;i++){
  const [ux,uy]=heartPoint();
  P.push({x:Math.random()*W,y:Math.random()*H,ux,uy,vx:0,vy:0,a:1,
    k:0.03+Math.random()*0.05,s:0.6+Math.random()*1.6,
    c:BLUE_SHADES[(Math.random()*BLUE_SHADES.length)|0],ph:Math.random()*6.28});
}

// phases: 0 form, 1 hold, 2 burst, 3 reform, 4 text
const DUR=[3200,1200,2300,2600];
let phase=0,tStart=performance.now(),textStart=0;
function setPhase(n,now){
  phase=n;tStart=now;
  if(n===2){
    for(const p of P){
      let dx=p.x-W/2,dy=p.y-H/2,l=Math.hypot(dx,dy)||1,sp=1.5+Math.random()*8;
      p.vx=dx/l*sp;p.vy=dy/l*sp;
    }
  }
  if(n===3){
    for(const p of P){const [ux,uy]=heartPoint();p.ux=ux;p.uy=uy;
      p.x=W/2+(Math.random()-.5)*W*1.2;p.y=H/2+(Math.random()-.5)*H*1.2;p.a=0;}
  }
  if(n===4)textStart=now;
}
addEventListener('pointerdown',()=>{if(phase!==2)setPhase(2,performance.now());});

function drawText(a){
  const size=S*2.5;
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=a;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 '+size+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.shadowColor='#3b82f6';ctx.shadowBlur=18+10*Math.sin(performance.now()/400);
  ctx.fillStyle='#eaf2ff';
  const cy=H/2-S*2.5*0+S*0;
  ctx.fillText('Are you happy',W/2,cy-size*0.6);
  ctx.fillText('tushta',W/2,cy+size*0.7);
  ctx.restore();
}

function frame(now){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  const el=now-tStart;
  if(phase<4&&el>DUR[phase])setPhase(phase+1,now);
  const pulse=1+0.02*Math.sin(now/300);
  const cx=W/2,cy=H*0.47;

  for(const p of P){
    if(phase===2){
      p.x+=p.vx;p.y+=p.vy;p.vx*=0.975;p.vy*=0.975;
      p.a=Math.max(0,p.a-0.011);
    }else{
      if(phase===3)p.a=Math.min(1,p.a+0.02);
      const tx=cx+p.ux*S*pulse,ty=cy-p.uy*S*pulse;
      const k=phase===0?p.k*0.7:p.k;
      p.x+=(tx-p.x)*k+Math.sin(now/500+p.ph)*0.25;
      p.y+=(ty-p.y)*k+Math.cos(now/450+p.ph)*0.25;
    }
    if(p.a<=0)continue;
    ctx.globalAlpha=p.a*(0.55+0.45*Math.sin(now/260+p.ph));
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.s,p.s);
  }
  ctx.globalAlpha=1;

  drawText(Math.min(1,now/1200));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
